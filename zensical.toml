[project]
site_name = "karo-stack docs"
site_description = "The karo-stack documentation."
site_author = "hazzuk"
site_url = "https://docs.karolabs.dev/"

copyright = """&copy; 2026 hazzuk"""

repo_name = "hazzuk/karo-stack"
repo_url = "https://github.com/hazzuk/karo-stack"

nav = [
  { "Home" = [
    "index.md",
  ] },
  { "Setup" = [
    "setup/requirements.md",
    "setup/intro.md",
    { "Preparation" = [
      "setup/prepare/dns.md",
      "setup/prepare/ssh.md",
    ] },
    { "Installation" = [
      "setup/debian/preseed.md",
      "setup/debian/install.md",
    ] },
    { "Configuration" = [
      "setup/configure/packages.md",
      "setup/configure/repos.md",
      "setup/configure/inventory.md",
      "setup/configure/vault.md",
    ] },
    { "Implementation" = [
      "setup/implement/ansible.md",
    ] },
  ] },
  { "Custom" = [
    { "karo-custom" = [
      "custom/index.md",
    ] },
    "custom/compose.md",
  ] },
  { "Usage" = [
    "usage/just.md",
    "usage/linux.md",
    "usage/git.md",
    "usage/updates.md",
  ] },
  { "Advanced" = [
    "advanced/access.md",
    "advanced/proxy.md",
    "advanced/storage.md",
    "advanced/restore.md",
  ] },
  { "Development" = [
    { "karo-custom" = [
      "dev/structure.md",
      { "Compose" = [
        "dev/compose/services.md",
        "dev/compose/defaults.md",
        "dev/compose/templates.md",
        "dev/compose/secrets.md",
        "dev/compose/upgrades.md",
      ] },
    ] },
    { "karo-stack" = [
      "dev/documentation.md",
    ] },
  ] },
]

extra_css = ["stylesheets/extra.css"]

[project.theme]
custom_dir = "overrides"
favicon = "assets/favicon.ico"
language = "en"

# https://zensical.org/docs/
features = [
  "announce.dismiss",
  # "content.action.edit",
  # "content.action.view",
  "content.code.annotate",
  "content.code.copy",
  # "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  # "header.autohide",
  "navigation.expand",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  # "navigation.instant.progress",
  "navigation.path",
  # "navigation.prune",
  "navigation.sections",
  "navigation.tabs",
  # "navigation.tabs.sticky",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  # "toc.follow",
  # "toc.integrate",
]

# custom icon as logo (for light/dark mode svg support)
[project.theme.icon]
logo = "karo"

# [project.theme.font]
# text = "Inter"
# code = "Jetbrains Mono"

# palette for dark mode
[[project.theme.palette]]
scheme = "slate"

# [[project.extra.social]]
# icon = "fontawesome/brands/github"
# link = "https://github.com/hazzuk/karo-stack"

# page status symbols
[project.extra.status]
new = "Recently added"

# extensions
# https://zensical.org/docs/authoring/markdown/

[project.markdown_extensions.attr_list]  # add html/css to markdown lines

[project.markdown_extensions.md_in_html]  # write markdown inbetween html

[project.markdown_extensions.pymdownx.blocks.caption]  # add captions markdown blocks

[project.markdown_extensions.pymdownx.details]  # improved call-outs

[project.markdown_extensions.pymdownx.highlight]  # syntax highlighting
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true

[project.markdown_extensions.pymdownx.inlinehilite]  # in-line syntax highlighting

[project.markdown_extensions.pymdownx.snippets]  # embed external files
base_path = ["includes"]
auto_append = ["abbreviations.md"]

[project.markdown_extensions.pymdownx.superfences]  # nest code/content blocks
custom_fences = [{ name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" }]

[project.markdown_extensions.pymdownx.tabbed]  # content tabs
alternate_style = true

[project.markdown_extensions.pymdownx.tabbed.slugify]  # anchor links
object = "pymdownx.slugs.slugify"
kwds = { case = "lower" }

[project.markdown_extensions.pymdownx.caret]  # formatting text

[project.markdown_extensions.pymdownx.mark]

[project.markdown_extensions.pymdownx.tilde]

[project.markdown_extensions.pymdownx.keys]  # render keyboard keys

[project.markdown_extensions.pymdownx.betterem]

[project.markdown_extensions.pymdownx.emoji]  # icons and emoji
emoji_index = "zensical.extensions.emoji.twemoji"
emoji_generator = "zensical.extensions.emoji.to_svg"
# custom icons directory
options.custom_icons = ["overrides/.icons"]

[project.markdown_extensions.pymdownx.tasklist]  # lists
custom_checkbox = true
clickable_checkbox = true

[project.markdown_extensions.admonition]  # call-outs (admonitions)

[project.markdown_extensions.toc]
permalink = true

[project.markdown_extensions.tables]  # data tables

[project.markdown_extensions.footnotes]  # footnotes

[project.markdown_extensions.abbr]  # tooltip abbreviations
